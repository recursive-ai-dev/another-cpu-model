[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "another-cpu-model"
version = "0.1.0"
description = "CPU-first manifold clustering pipeline with resumable checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["another_cpu_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
